<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Footing 1.3.1</title>
<style>
@font-face { font-family: "Bricolage"; src: url(fonts/BricolageGrotesque-ExtraBold.ttf); font-weight: 800; }
@font-face { font-family: "Bricolage"; src: url(fonts/BricolageGrotesque-Bold.ttf); font-weight: 700; }
@font-face { font-family: "Figtree"; src: url(fonts/Figtree-Regular.ttf); font-weight: 400; }
@font-face { font-family: "Figtree"; src: url(fonts/Figtree-Medium.ttf); font-weight: 500; }
@font-face { font-family: "Figtree"; src: url(fonts/Figtree-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: "Figtree"; src: url(fonts/Figtree-Bold.ttf); font-weight: 700; }
:root {
  --ground: #EEF1F6; --card: #FFFFFF; --ink: #0F172A; --muted: #475569; --faint: #55637A;
  --hero: #4F46E5; --heroDeep: #1E1B4B; --heroLabel: #C7D2FE;
  --lime: #D9F99D; --limeInk: #1A2E05; --limeLabel: #365314; --limeLine: #4D7C0F;
  --violet: #EDE9FE; --violetLabel: #5B21B6; --sky: #E0F2FE; --skyAction: #0284C7;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground);
  font-family: "Figtree", system-ui, sans-serif; color: var(--ink); }
.abs { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; will-change: transform, opacity; }
.hidden { opacity: 0; }

/* Ambient */
.blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }

/* Pulse mark */
.mark svg { display: block; width: 100%; height: 100%; overflow: visible; }

/* Type */
.eyebrow { display: inline-flex; align-items: center; gap: 12px; padding: 10px 18px 10px 14px; border-radius: 999px;
  background: var(--card); color: var(--hero); font: 700 22px/1 "Figtree"; letter-spacing: .14em; text-transform: uppercase;
  box-shadow: 0 6px 24px rgba(30,27,75,.08); }
.eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--hero); }
.headline { font: 800 84px/0.98 "Bricolage"; letter-spacing: -0.025em; color: var(--ink); width: 760px; }
.headline .ln { display: block; overflow: hidden; padding-bottom: .08em; margin-bottom: -.08em; }
.headline .wd { display: inline-block; will-change: transform; }
.body { font: 500 31px/1.35 "Figtree"; color: var(--muted); width: 660px; }

/* Pulse speaking */
.say { display: flex; align-items: flex-end; gap: 16px; }
.say .av { width: 64px; height: 64px; border-radius: 20px; background: var(--hero); padding: 14px; flex: none;
  box-shadow: 0 10px 24px rgba(79,70,229,.30); }
.say .bub { position: relative; background: var(--card); border-radius: 30px 30px 30px 10px; padding: 20px 28px;
  font: 600 31px/1.3 "Figtree"; color: var(--ink); box-shadow: 0 14px 40px rgba(15,23,42,.10); max-width: 760px; }
.say .bub .w { display: inline-block; opacity: 0; }
.say .dots { position: absolute; left: 26px; top: 50%; margin-top: -8px; display: flex; gap: 8px; }
.say .dots i { width: 14px; height: 14px; border-radius: 50%; background: #A5B4FC; display: block; }

/* Phone */
.phone { width: 456px; height: 963px; border-radius: 70px; background: #0F172A; padding: 12px;
  box-shadow: 0 50px 90px rgba(30,27,75,.22), 0 12px 24px rgba(30,27,75,.10); }
.screen { position: relative; width: 432px; height: 939px; border-radius: 58px; overflow: hidden; background: var(--ground); }
.screen img.scr { position: absolute; left: 0; top: 0; width: 432px; height: 939px; }
.island { position: absolute; left: 50%; top: 14px; width: 118px; height: 34px; margin-left: -59px; border-radius: 20px; background: #000; z-index: 101; }

.crop { display: block; }
.lifted { box-shadow: 0 30px 60px rgba(30,27,75,.20), 0 8px 18px rgba(30,27,75,.10); }

.pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 12px; padding: 14px 24px; border-radius: 999px;
  font: 700 30px/1 "Figtree"; }
.chip { display: inline-block; padding: 16px 26px; border-radius: 22px; background: var(--card); font: 600 30px/1 "Figtree";
  color: var(--ink); box-shadow: 0 12px 30px rgba(15,23,42,.10); white-space: nowrap; }

#flood { width: 1920px; height: 1400px; }
#flood .fill { position: absolute; left: 0; top: 60px; width: 1920px; height: 1280px; background: var(--lime); }
#flood svg { position: absolute; left: 0; width: 3840px; height: 64px; }
.bubble { width: 30px; height: 30px; border-radius: 50%; background: var(--lime); border: 3px solid var(--limeLine); }
.confetti { width: 18px; height: 18px; border-radius: 50%; }

.big { font: 800 300px/1 "Bricolage"; letter-spacing: -0.04em; color: var(--limeInk); white-space: nowrap; }
.big small { font-size: 120px; letter-spacing: 0; }
.wordmark { font: 800 230px/1 "Bricolage"; letter-spacing: -0.035em; color: var(--ink); white-space: nowrap; }
.wordmark span { display: inline-block; }
.fine { font: 500 22px/1.3 "Figtree"; color: var(--faint); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// Footing 1.3.1 — motion piece. Everything is a Web Animation created up front;
// seek(t) freezes the whole frame at time t, so a renderer can step frame by frame.
// ─────────────────────────────────────────────────────────────────────────────
const W = 1920, H = 1080;
const stage = document.getElementById('stage');
const K = 432 / 1206;                 // phone screen scale (screenshot px → video px)
const SCR_W = 1206, SCR_H = 2622;

// Easing. Springs are sampled into CSS linear() so WAAPI can run them.
function spring(zeta) {
  const w = Math.log(400) / zeta, wd = w * Math.sqrt(1 - zeta * zeta), pts = [];
  for (let i = 0; i <= 100; i++) {
    const t = i / 100;
    const x = 1 - Math.exp(-zeta * w * t) * (Math.cos(wd * t) + zeta / Math.sqrt(1 - zeta * zeta) * Math.sin(wd * t));
    pts.push(+x.toFixed(4));
  }
  pts[100] = 1;
  return `linear(${pts.join(', ')})`;
}
const E = {
  pop: spring(0.38), bounce: spring(0.5), soft: spring(0.72),
  out: 'cubic-bezier(0.16, 1, 0.3, 1)', in: 'cubic-bezier(0.7, 0, 0.84, 0)',
  inOut: 'cubic-bezier(0.65, 0, 0.35, 1)', lin: 'linear',
};

// Tweening with remembered state, so each move starts where the last one ended.
const ST = new Map();
const base = { x: 0, y: 0, s: 1, sx: 1, sy: 1, r: 0, o: 1 };
function css(p) {
  return { transform: `translate(${p.x}px, ${p.y}px) rotate(${p.r}deg) scale(${p.s * p.sx}, ${p.s * p.sy})`, opacity: p.o };
}
function init(el, p = {}) {
  const s = { ...base, ...p }; ST.set(el, s);
  const c = css(s); el.style.transform = c.transform; el.style.opacity = c.opacity; return el;
}
function tw(el, t, d, to, ease = 'out') {
  const from = ST.get(el) || { ...base }; const next = { ...from, ...to };
  el.animate([css(from), css(next)], { delay: t * 1000, duration: Math.max(d, 0.001) * 1000, fill: 'forwards', easing: E[ease] || ease });
  ST.set(el, next); return el;
}
// Keyframe animation on any properties (not transform-state tracked).
function kf(el, t, d, frames, ease = 'out', extra = {}) {
  return el.animate(frames, { delay: t * 1000, duration: d * 1000, fill: 'forwards', easing: E[ease] || ease, ...extra });
}
const onSeek = [];

function mk(tag, cls, html, parent = stage) {
  const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html;
  parent.appendChild(e); return e;
}
function place(el, left, top) { el.style.left = left + 'px'; el.style.top = top + 'px'; return el; }

// Pulse mark: track ring, 250° arc from 12 o'clock, dot at the arc's end (Shared/PulseMark.swift).
function markSVG(color = '#fff') {
  const C = 2 * Math.PI * 43, L = C * 0.694;
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="43" fill="none" stroke="${color}" stroke-opacity=".28" stroke-width="14" class="trk"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" transform="rotate(-90 50 50)"
    stroke-dasharray="${L} 400" stroke-dashoffset="0" class="arc"/>
  <circle cx="9.59" cy="64.71" r="11.9" fill="${color}" class="dt" style="transform-origin:9.59px 64.71px"/></svg>`;
}
const ARC_LEN = 2 * Math.PI * 43 * 0.694;

// Seeded randomness so every render is identical.
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ── Building blocks ─────────────────────────────────────────────────────────

function headline(lines, left, top, size) {
  const h = mk('div', 'headline abs'); place(h, left, top); if (size) h.style.fontSize = size + 'px';
  const words = [];
  lines.forEach(line => {
    const ln = mk('span', 'ln', null, h);
    line.split(' ').forEach((w, i) => { const s = mk('span', 'wd', w, ln); words.push(s); if (i < line.split(' ').length - 1) ln.appendChild(document.createTextNode(' ')); });
  });
  init(h); words.forEach(w => init(w, { y: 130 }));
  return { el: h, words };
}
function showHeadline(hl, t) { hl.words.forEach((w, i) => tw(w, t + i * 0.055, 0.85, { y: 0 }, 'out')); }
function hideBlock(el, t, dx = -140) { tw(el, t, 0.45, { x: dx, o: 0 }, 'in'); }

function eyebrow(text, left, top, color) {
  const e = mk('div', 'eyebrow abs', `<span class="dot"></span>${text}`); place(e, left, top);
  if (color) { e.style.color = color; e.querySelector('.dot').style.background = color; }
  init(e, { o: 0, s: 0.6, y: 20 }); return e;
}
function showPop(el, t, d = 0.8) { tw(el, t, 0.01, { o: 1 }, 'lin'); tw(el, t, d, { s: 1, y: 0, x: 0, r: 0 }, 'pop'); }

function bodyText(text, left, top, w) {
  const b = mk('div', 'body abs', text); place(b, left, top); if (w) b.style.width = w + 'px'; init(b, { o: 0, y: 30 }); return b;
}
function showFade(el, t, d = 0.7) { tw(el, t, d, { o: 1, y: 0 }, 'out'); }

// Pulse "speaking": the avatar pops, three dots type, the bubble opens to the words.
function say(text, left, top, t, opts = {}) {
  const box = mk('div', 'say abs'); place(box, left, top);
  const av = mk('div', 'av mark', markSVG('#fff'), box);
  const bub = mk('div', 'bub', null, box);
  if (opts.maxW) bub.style.maxWidth = opts.maxW + 'px';
  if (opts.size) bub.style.fontSize = opts.size + 'px';
  const words = text.split(' ').map((w, i, a) => { const s = mk('span', 'w', w, bub); if (i < a.length - 1) bub.appendChild(document.createTextNode(' ')); return s; });
  const dots = mk('div', 'dots', '<i></i><i></i><i></i>', bub);
  init(box, { o: 0, s: 0.5, y: 30 });
  box.style.transformOrigin = '0% 100%';
  const typing = opts.typing ?? 0.7;
  const bw = bub.offsetWidth;
  // Bubble opens from a dots-sized pill to full width.
  bub.style.clipPath = `inset(0 ${bw - 96}px 0 0 round 30px 30px 30px 10px)`;
  tw(box, t, 0.01, { o: 1 }, 'lin'); tw(box, t, 0.8, { s: 1, y: 0 }, 'pop');
  [...dots.children].forEach((d, i) => kf(d, t + 0.15 + i * 0.12, 0.42, [
    { transform: 'translateY(0)' }, { transform: 'translateY(-9px)', offset: .45 }, { transform: 'translateY(0)' }],
    'inOut', { iterations: Math.max(1, Math.round((typing - 0.15) / 0.42)) }));
  kf(dots, t + typing, 0.15, [{ opacity: 1 }, { opacity: 0 }], 'lin');
  kf(bub, t + typing, 0.55, [{ clipPath: `inset(0 ${bw - 96}px 0 0 round 30px 30px 30px 10px)` }, { clipPath: 'inset(0 0px 0 0 round 30px 30px 30px 10px)' }], 'out');
  words.forEach((w, i) => { init(w, { o: 0, y: 16 }); tw(w, t + typing + 0.08 + i * 0.045, 0.6, { o: 1, y: 0 }, 'bounce'); });
  // A little nod from the avatar as it starts to talk.
  kf(av, t + typing, 0.5, [{ transform: 'scale(1)' }, { transform: 'scale(1.12) rotate(-8deg)', offset: .4 }, { transform: 'scale(1)' }], 'out');
  return box;
}

// ── Phone ───────────────────────────────────────────────────────────────────
const phoneWrap = mk('div', 'abs'); place(phoneWrap, 960 - 228, 540 - 481.5);
const phone = mk('div', 'phone', null, phoneWrap);
const screen = mk('div', 'screen', null, phone);
mk('div', 'island', null, screen);
const phoneOv = mk('div', 'abs', null, screen); phoneOv.style.zIndex = 100;
init(phoneWrap, { y: 1200, o: 1 });
const screens = {};
function addScreen(name) { const i = mk('img', 'scr', null, screen); i.src = `img/${name}.jpg`; screens[name] = i; init(i, { y: 939 }); return i; }
['today', 'floor-cleared', 'log-talk', 'shot-day'].forEach(addScreen);
let currentScreen = null;
function showScreen(name, t) {
  const img = screens[name]; img.style.zIndex = (++zc);
  if (!currentScreen) { tw(img, t, 0.01, { y: 0 }, 'lin'); }
  else {
    tw(img, t, 0.7, { y: 0 }, 'out');
    const prev = screens[currentScreen]; tw(prev, t, 0.7, { y: -160, o: 0.4 }, 'out'); tw(prev, t + 0.7, 0.01, { y: 939, o: 1 }, 'lin');
  }
  currentScreen = name;
}
let zc = 1;
// Where a screenshot box sits on the video frame, for the phone's current offset (scale 1).
function onPhone(box) {
  const p = ST.get(phoneWrap);
  const cx = 960 + p.x, cy = 540 + p.y;
  return { left: cx + (box[0] - SCR_W / 2) * K, top: cy + (box[1] - SCR_H / 2) * K, w: (box[2] - box[0]) * K, h: (box[3] - box[1]) * K };
}
// A UI piece that lifts out of the phone: starts exactly over its spot, then springs to a pose.
function lift(name, t, to, radiusPt = 26, d = 1.0) {
  const c = CROPS[name]; const pos = onPhone(c.box);
  const el = mk('img', 'crop abs'); el.src = `img/${name}.png`;
  el.style.width = pos.w + 'px'; el.style.height = pos.h + 'px'; el.style.borderRadius = (radiusPt * 3 * K) + 'px';
  place(el, pos.left, pos.top); layerTop.appendChild(el);
  init(el, { o: 0 });
  tw(el, t, 0.01, { o: 1 }, 'lin');
  tw(el, t + 0.01, d, to, 'pop');
  kf(el, t, d * 0.6, [{ boxShadow: '0 0 0 rgba(30,27,75,0)' }, { boxShadow: '0 40px 70px rgba(30,27,75,.22), 0 10px 20px rgba(30,27,75,.10)' }], 'out');
  return el;
}

// ── Layers ──────────────────────────────────────────────────────────────────
let CROPS = {};
let layerTop;

async function build() {
  CROPS = await (await fetch('img/crops.json')).json();
  layerTop = mk('div', 'abs'); layerTop.style.zIndex = 50;

  // Ambient: soft colour drifting behind everything, the whole time.
  [['#D9F99D', 520, 140, 120, 520], ['#C7D2FE', 640, 1500, 640, 460], ['#E0F2FE', 560, 900, 980, -380],
   ['#EDE9FE', 480, 260, 860, 300]].forEach(([c, s, x, y, dx], i) => {
    const b = mk('div', 'blob abs'); b.style.background = c; b.style.width = b.style.height = s + 'px';
    place(b, x, y); stage.insertBefore(b, stage.firstChild);
    kf(b, 0, 9 + i * 2, [{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${dx}px, ${-dx / 3}px) scale(1.15)` }], 'inOut', { iterations: 8, direction: 'alternate' });
  });
  stage.appendChild(phoneWrap); phoneWrap.style.zIndex = 20;

  // ═══ S0 · Pulse says hello (0 – 4.4) ═══════════════════════════════════════
  const hello = mk('div', 'mark abs', markSVG('#4F46E5')); hello.style.width = hello.style.height = '220px';
  place(hello, 960 - 110, 540 - 110); init(hello, { s: 1 }); hello.style.zIndex = 30;
  const hTrk = hello.querySelector('.trk'), hArc = hello.querySelector('.arc'), hDot = hello.querySelector('.dt');
  hTrk.style.opacity = 0; hArc.style.strokeDashoffset = ARC_LEN; hDot.style.transform = 'scale(0)';
  kf(hTrk, 0.15, 0.5, [{ opacity: 0 }, { opacity: 1 }], 'out');
  kf(hArc, 0.3, 1.0, [{ strokeDashoffset: ARC_LEN }, { strokeDashoffset: 0 }], 'out');
  kf(hDot, 1.05, 0.7, [{ transform: 'scale(0)' }, { transform: 'scale(1)' }], 'pop');
  tw(hello, 1.05, 0.25, { sx: 1.08, sy: 0.92 }, 'out'); tw(hello, 1.3, 0.6, { sx: 1, sy: 1 }, 'pop');
  tw(hello, 1.7, 0.9, { x: -420, s: 0.62 }, 'bounce');
  const s0a = say("Hi, I'm Pulse.", 760, 400, 2.0, { size: 46, typing: 0.55 });
  const s0b = say("Here's what's new in Footing.", 760, 530, 2.95, { size: 46, typing: 0.5 });
  [s0a, s0b].forEach((b, i) => tw(b, 4.0 + i * 0.07, 0.45, { y: -120, o: 0 }, 'in'));
  // The mark rolls into place as the wordmark's logo.
  tw(hello, 3.95, 0.9, { x: -560, y: -10, s: 0.82, r: -360 }, 'bounce');

  // ═══ S1 · Title (4.4 – 8.2) ════════════════════════════════════════════════
  const wm = mk('div', 'wordmark abs'); place(wm, 640, 420); wm.style.zIndex = 31;
  const letters = 'Footing'.split('').map(ch => mk('span', null, ch, wm));
  letters.forEach((l, i) => { init(l, { y: -720, r: (i % 2 ? 12 : -12) }); tw(l, 4.2 + i * 0.06, 0.95, { y: 0, r: 0 }, 'bounce'); });
  // Each letter squashes as it lands.
  letters.forEach((l, i) => {
    tw(l, 4.55 + i * 0.06, 0.12, { sx: 1.12, sy: 0.86 }, 'out'); tw(l, 4.67 + i * 0.06, 0.5, { sx: 1, sy: 1 }, 'pop');
  });
  const ver = mk('div', 'pill abs', '1.3.1'); ver.style.background = 'var(--lime)'; ver.style.color = 'var(--limeInk)';
  ver.style.fontSize = '54px'; ver.style.padding = '18px 34px'; place(ver, 1500, 330); init(ver, { s: 0, r: -30 }); ver.style.zIndex = 32;
  tw(ver, 5.05, 0.9, { s: 1, r: -8 }, 'pop');
  const sub = bodyText('Protein-first tracking, built for life on GLP-1.', 660, 690, 900); sub.style.fontSize = '40px'; sub.style.zIndex = 31;
  showFade(sub, 5.4);
  // Pulse mark gives a little hop beside the name.
  tw(hello, 5.9, 0.18, { y: -60, sx: 0.94, sy: 1.08 }, 'out'); tw(hello, 6.08, 0.5, { y: -10, sx: 1, sy: 1 }, 'bounce');
  letters.forEach((l, i) => tw(l, 7.55 + i * 0.035, 0.5, { y: -900, r: (i % 2 ? 20 : -20) }, 'in'));
  tw(ver, 7.6, 0.5, { x: 700, r: 30 }, 'in'); tw(sub, 7.6, 0.4, { o: 0, y: 40 }, 'in');
  tw(hello, 7.65, 0.55, { x: -1300, r: -720, s: 0.5 }, 'in');

  // ═══ S2 · Today (8.2 – 14.6) ═══════════════════════════════════════════════
  tw(phoneWrap, 8.0, 1.0, { x: 400, y: 0 }, 'bounce');
  showScreen('today', 8.0);
  const e2 = eyebrow('Today', 150, 300); showPop(e2, 8.35);
  const h2 = headline(['Your whole day,', 'at a glance.'], 150, 370); showHeadline(h2, 8.45);
  const pr = lift('today-protein', 9.6, { x: -170, y: 30, s: 1.5, r: -6 });
  const cal = lift('today-calories', 9.85, { x: 150, y: -190, s: 1.4, r: 5 });
  // The protein tile breathes while it hangs there.
  kf(pr, 10.6, 1.6, [{ translate: '0 0' }, { translate: '0 -14px' }], 'inOut', { iterations: 2, direction: 'alternate' });
  const s2 = say('45g to go. One protein-forward dinner covers it.', 150, 640, 10.5, { maxW: 640 });
  // Off they go.
  tw(pr, 13.7, 0.55, { x: -1400, y: -200, r: -30, o: 0 }, 'in');
  tw(cal, 13.75, 0.55, { x: 1200, y: -500, r: 30 }, 'in');
  [e2, h2.el, s2].forEach((el, i) => hideBlock(el, 13.85 + i * 0.06));

  // ═══ S3 · Floor cleared (14.6 – 21.4) ═════════════════════════════════════
  const flood = mk('div', 'abs'); flood.id = 'flood'; place(flood, 0, 0); flood.style.zIndex = 60;
  mk('div', 'fill', null, flood);
  const wavePath = (y0, up) => { let d = `M0 ${y0}`; for (let x = 0; x <= 3840; x += 240) d += ` Q ${x + 120} ${up ? 0 : 64}, ${x + 240} ${y0}`; return d + (up ? ` V64 H0 Z` : ` V0 H0 Z`); };
  const wTop = mk('div', 'abs', `<svg viewBox="0 0 3840 64" preserveAspectRatio="none"><path d="${wavePath(32, true)}" fill="#D9F99D"/></svg>`, flood);
  wTop.style.width = '3840px'; wTop.style.height = '64px'; place(wTop, 0, 0);
  const wBot = mk('div', 'abs', `<svg viewBox="0 0 3840 64" preserveAspectRatio="none"><path d="${wavePath(32, false)}" fill="#D9F99D"/></svg>`, flood);
  wBot.style.width = '3840px'; wBot.style.height = '64px'; place(wBot, 0, 1338);
  kf(wTop, 14.2, 1.2, [{ transform: 'translateX(0)' }, { transform: 'translateX(-480px)' }], 'lin', { iterations: 6 });
  kf(wBot, 14.2, 1.2, [{ transform: 'translateX(-480px)' }, { transform: 'translateX(0)' }], 'lin', { iterations: 6 });
  init(flood, { y: 1150 });
  tw(flood, 14.45, 1.05, { y: -150 }, 'inOut');

  const big = mk('div', 'big abs', '<span id="cnt">85</span><small>g</small>'); place(big, 560, 300); big.style.zIndex = 62;
  init(big, { o: 0, y: 80, s: 0.9 });
  tw(big, 15.0, 0.6, { o: 1, y: 0, s: 1 }, 'out');
  const cnt = big.querySelector('#cnt');
  onSeek.push(t => {
    const p = Math.min(1, Math.max(0, (t - 15.1) / 1.0)); const e = 1 - Math.pow(1 - p, 3);
    cnt.textContent = Math.round(85 + (136 - 85) * e);
  });
