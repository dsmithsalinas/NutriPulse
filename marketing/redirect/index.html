<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footing has moved</title>
<!-- Redirect, three ways, because this URL is load-bearing.
     GitHub Pages serves static files only and cannot issue a real 301, so:
       1. <meta refresh>   — works with JavaScript disabled
       2. rel=canonical    — tells search engines where the page really lives
       3. location.replace — instant, and leaves no back-button trap
     A visible link is the final fallback: Config.swift notes App Review fetches
     the privacy URL, so a reviewer must land somewhere real even if every
     automatic hop fails. -->
<meta http-equiv="refresh" content="0; url=https://tryfooting.app/">
<link rel="canonical" href="https://tryfooting.app/">
<meta name="robots" content="noindex, follow">
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #F6F5FC; color: #14163A; text-align: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    line-height: 1.6; letter-spacing: -0.01em;
  }
  h1 { font-size: 25px; font-weight: 600; letter-spacing: -0.03em; margin: 0 0 10px; }
  p { margin: 0 0 22px; color: rgba(20,22,58,.66); max-width: 42ch; }
  a.btn {
    display: inline-block; padding: 13px 26px; border-radius: 999px;
    background: linear-gradient(135deg,#6366F1,#8B5CF6); color: #fff;
    text-decoration: none; font-weight: 600; font-size: 15px;
  }
</style>
</head>
<body>
  <main>
    <h1>Footing has moved.</h1>
    <p>We&rsquo;re now at tryfooting.app. Taking you there&hellip;</p>
    <a class="btn" href="https://tryfooting.app/">Go to tryfooting.app &rarr;</a>
  </main>
  <script>location.replace("https://tryfooting.app/");</script>
</body>
</html>
