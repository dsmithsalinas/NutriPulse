name: Footing

# XcodeGen generates Footing.xcodeproj from this file.
# Edit project.yml and run `xcodegen generate` — never hand-edit the .xcodeproj.

options:
  # Bundle-ID prefix is deliberately still `nutripulse`: changing it would orphan every
  # existing install (new bundle ID = new app to Apple) and break the App Group container.
  # The rename to Footing is a display-name change only.
  bundleIdPrefix: com.dustin.nutripulse
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true
  createIntermediateGroups: true

# Build settings injected via xcconfig (see Configurations/).
# SUPABASE_URL and SUPABASE_ANON_KEY flow in from Secrets.xcconfig.
configFiles:
  Debug: Configurations/Debug.xcconfig
  Release: Configurations/Release.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: "2.0.0"

targets:
  Footing:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # Source directories keep their original names — renaming them would churn every
    # path in this file and the whole git history for no user-visible gain.
    sources:
      - path: NutriPulse
      - path: Shared
    info:
      path: NutriPulse/Info.plist
      properties:
        CFBundleDisplayName: Footing
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.dustin.nutripulse.app.auth
            CFBundleURLSchemes:
              - footing
        # Only standard HTTPS/TLS is used — exempt encryption. Declaring this here answers
        # the export-compliance question up front so App Store Connect stops prompting on
        # every upload. Flip to true only if we ever add non-exempt/custom cryptography.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "Footing reads weight, body fat, BMI, lean body mass, water, active energy, HRV, resting HR, and sleep from Apple Health."
        NSHealthUpdateUsageDescription: "Footing writes weight, body fat, BMI, lean body mass, and water logs to Apple Health."
        NSCameraUsageDescription: "Footing uses the camera to scan food barcodes."
        NSMicrophoneUsageDescription: "Footing uses the microphone so you can speak your food log instead of typing it."
        NSSpeechRecognitionUsageDescription: "Footing transcribes your spoken food log into text so Pulse can parse it."
        # These land in Info.plist so Config.swift can read them at runtime.
        # Values are set in Configurations/Secrets.xcconfig (gitignored).
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        TELEMETRYDECK_APP_ID: "$(TELEMETRYDECK_APP_ID)"
    entitlements:
      path: NutriPulse/NutriPulse.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.dustin.nutripulse
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.dustin.nutripulse.app
        DEVELOPMENT_TEAM: "G574NUGMU2"
        MARKETING_VERSION: "1.3.0"
        # CURRENT_PROJECT_VERSION is deliberately NOT set here — a target-level setting would
        # override the xcconfig that carries the git-derived build number.
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        # iPhone only. XcodeGen's default (1,2) claimed iPad support, which trips the store
        # validator — "All interface orientations must be supported unless the app requires
        # full screen" — because this app is portrait-only. It has no iPad layout either, so
        # iPad reviewers and TestFlight testers would get a stretched phone UI, and the App
        # Store listing would demand iPad screenshots.
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Supabase
        product: Supabase
      - package: TelemetryDeck
        product: TelemetryDeck
      - target: FootingWidgets
    # Build number = git commit count, supplied as CURRENT_PROJECT_VERSION by
    # Configurations/BuildNumber.xcconfig (regenerated by scripts/set-build-number.sh).
    # This used to be a post-build script that rewrote the built Info.plist, which silently
    # did nothing: Xcode runs ProcessInfoPlistFile after the script phases and regenerates the
    # plist from the build setting, so every build shipped CFBundleVersion 1. The phase below
    # only warns — it can't fix the number mid-build, because the setting is already resolved.
    preBuildScripts:
      - name: Warn if build number is stale
        basedOnDependencyAnalysis: false
        script: |
          [ "$CONFIGURATION" = "Release" ] || exit 0
          n=$(cd "$SRCROOT" && git rev-list --count HEAD 2>/dev/null || echo "")
          if [ -n "$n" ] && [ "$n" != "$CURRENT_PROJECT_VERSION" ]; then
            echo "warning: build number is $CURRENT_PROJECT_VERSION but git is at $n — run scripts/set-build-number.sh, then re-run xcodegen generate"
          fi

  # Home Screen + Lock Screen widgets for the protein floor. Shares data with the app through
  # the App Group container (see Shared/ProteinFloorShared.swift).
  FootingWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NutriPulseWidgets
      - path: Shared
    info:
      path: NutriPulseWidgets/Info.plist
      properties:
        CFBundleDisplayName: Footing
        # Must match the parent app's, or upload validation complains (and the drift grows
        # the moment MARKETING_VERSION moves off 1.0.0). CFBundleVersion is already kept in
        # lockstep by the post-build script below.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NutriPulseWidgets/NutriPulseWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dustin.nutripulse
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.dustin.nutripulse.app.widgets
        DEVELOPMENT_TEAM: "G574NUGMU2"
        MARKETING_VERSION: "1.3.0"
        # See the app target: CURRENT_PROJECT_VERSION comes from the xcconfig, not from here,
        # which is also what keeps the widget's build number in lockstep with the app's.
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"

  FootingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NutriPulseTests
    dependencies:
      - target: Footing
    settings:
      base:
        SWIFT_VERSION: "5.9"
        # Without this the test bundle can't code sign ("target does not have an
        # Info.plist file"), so `xcodebuild test` could never run at all.
        GENERATE_INFOPLIST_FILE: YES
