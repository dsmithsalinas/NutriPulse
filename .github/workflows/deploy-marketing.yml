name: Deploy marketing site to Pages

# Publishes the marketing/ landing page to GitHub Pages whenever it changes on main.
# Replaces the old manual `git subtree split --prefix marketing main` → force-push to
# gh-pages dance. The served URL stays https://dsmithsalinas.github.io/NutriPulse/
# (tied to the repo name), so the privacy link baked into shipped builds keeps working.
on:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - '.github/workflows/deploy-marketing.yml'
  workflow_dispatch: {}

# Least privilege for the Pages deploy; no write to repo contents.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deploys race; keep the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload marketing/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: marketing
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
